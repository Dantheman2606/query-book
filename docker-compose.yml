version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: query-book-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: querybook
    ports:
      - "5433:5432"  # Changed from "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
